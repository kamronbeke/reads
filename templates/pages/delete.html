{% extends 'base.html' %}

{% load static %}
{% block content %}
<h3>Delete review</h3>
<a>Are you sure you want to delete this review?</a>
    <form method="post" enctype="multipart/form-data">
        <div class="row">
            <div class="col-6">
                <div class="mx-5">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                   <h6>{{ review.user.username }}</h6> <br>
                   <h6>{{ review.comment }}</h6> <br>
                    <button type="submit">O'chirish</button>
                </form>
               </div>
            </div>
        </div>
    </form>
{% endblock content %}
